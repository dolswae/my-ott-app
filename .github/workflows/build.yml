name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Flutter 환경 설정
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 안드로이드 프로젝트 뼈대 생성 및 패키지 설치
        run: |
          flutter create . --platforms=android --org com.family.ott
          flutter pub get

      - name: APK 릴리즈 빌드
        run: flutter build apk --release

      - name: 완성된 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: my-family-ott-app
          path: build/app/outputs/flutter-apk/app-release.apk
